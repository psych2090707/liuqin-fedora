# liuqin (Xiaomi Pad 6 Pro, SM8475) — Fedora Workstation / GNOME aarch64 rootfs.
#
# Cross-arch build on the x86_64 host: rootful mkosi + rootful podman +
# qemu-user binfmt, Format=directory / Bootable=no (the liuqin boot.img is
# assembled later by the image task; there is no EFI/GRUB on this device).
#
# This file is the generic base shared by every profile.  The Fedora
# Workstation / GNOME package set lives in mkosi.profiles/gnome.conf; the
# historical KDE Plasma profile is kept in mkosi.profiles/plasma.conf.
# Device-specific packages and files are NOT part of this build: they are
# injected at root.img assembly time (see overlays/rootfs/README.md).
#
# Docs: mkosi/README.md                Driver: scripts/build-rootfs.sh
# Reference: Fedora Workstation comps (Fedora 45).

[Distribution]
Distribution=fedora
# Fedora stable release. Any override must also be passed to the script:
#   scripts/build-rootfs.sh --release 45
Release=45
Architecture=arm64

[Output]
Format=directory
# Report/manifests are produced next to the tree by scripts/build-rootfs.sh.
Output=rootfs
# Relative paths are resolved against this configuration directory (mkosi/).
OutputDirectory=../out/rootfs

[Content]
Bootable=no
WithDocs=false
# Match pipa/Fedora-minimal behaviour: weak deps are not installed. Runtime
# pieces that only exist as recommends are listed explicitly below.
WithRecommends=false
# Packages common to every profile (tty and desktop). Keep platform/runtime
# only; KDE Plasma lives in mkosi.profiles/plasma.conf, device layer RPMs
# (kernel-liuqin, liuqin-firmware, ...) are injected at image assembly time.
Packages=
    NetworkManager
    NetworkManager-config-connectivity-fedora
    NetworkManager-tui
    NetworkManager-wifi
    alsa-ucm
    alsa-ucm-utils
    alsa-utils
    atheros-firmware
    bash-completion
    bluez
    btop
    chrony
    cirrus-audio-firmware
    dbus-broker
    dracut
    dracut-config-generic
    dnf5
    dnf5-plugins
    dosfstools
    e2fsprogs
    efivar
    evtest
    fish
    glibc-all-langpacks
    hostname
    iproute
    iputils
    iptables-nft
    iw
    kmod
    libinput
    libinput-utils
    libqmi
    libqrtr-glib
    libwacom
    linux-firmware
    man-db
    mesa-dri-drivers
    mesa-libEGL
    mesa-vulkan-drivers
    nano
    openssh-clients
    openssh-server
    pciutils
    policycoreutils
    selinux-policy-targeted
    pipewire
    pipewire-alsa
    pipewire-pulseaudio
    plymouth
    plymouth-theme-spinner
    polkit
    qcom-firmware
    rsync
    shadow-utils
    strace
    sudo
    systemd-oomd-defaults
    systemd-pam
    systemd-resolved
    tar
    tmux
    tuned
    tuned-ppd
    usbutils
    vim-minimal
    wget2
    widevine-installer
    wireless-regdb
    wireplumber
    wpa_supplicant
    xdg-user-dirs
    xdg-utils
    zram-generator
    zram-generator-defaults

[Build]
# mkosi 27.1 requires an explicit CacheDirectory= when Incremental= is enabled
# (otherwise repository_metadata_needs_sync() hits a None assertion).
# Relative paths are resolved against this configuration directory (mkosi/).
CacheDirectory=../cache/mkosi
# First build creates an Arch tools tree (provides dnf5 for the cross-arch
# Fedora install); it is cached in mkosi/mkosi.tools and reused afterwards.
ToolsTree=yes
# Cache the package-install result so postinst/config iterations do not reinstall
# 1000+ rpms under qemu-user. `scripts/build-rootfs.sh --clean` wipes it.
Incremental=yes
# Match pipa: there is no bootloader/kernel-install at build time (boot.img is
# produced separately by the image task).
Environment=KERNEL_INSTALL_BYPASS=0
