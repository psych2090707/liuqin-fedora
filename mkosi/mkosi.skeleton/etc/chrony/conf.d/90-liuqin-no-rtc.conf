# liuqin: the PMK8350 RTC cannot be written from HLOS (upstream issue), so there
# is no reliable hardware clock across power cycles. Do not fail time sync on a
# missing/read-only RTC; step the clock once NTP becomes reachable.
# Source: the device has no usable RTC; keep chrony from stepping the clock
# backwards during early boot.
makestep 1.0 3
