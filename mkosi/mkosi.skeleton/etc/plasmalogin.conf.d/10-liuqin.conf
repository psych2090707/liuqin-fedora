# liuqin: Plasma Login Manager (plasmalogin) defaults for the tablet.
# The greeter's screen rotation/scale comes from the greeter user's
# $HOME/.config/kwinoutputconfig.json (installed by mkosi.postinst.chroot from
# /etc/skel). Autologin is deliberately off: the image boots to the greeter.
[Autologin]
Relogin=false
User=
Session=

[General]
# Physical keyboard attached via the magnetic pogo keyboard.
Numlock=on
