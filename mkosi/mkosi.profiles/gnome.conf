# liuqin Fedora 45 — Fedora Workstation / GNOME 51 profile.
#
# The tablet's daily desktop is GNOME, not KDE.  This profile starts from the
# official Fedora Workstation environment instead of carrying a curated KDE
# package list forward.  The groups are resolved by dnf from the Fedora 45
# comps data; the explicit additions below are the pieces the device layer and
# the user's daily workflow need on top of the stock environment.
#
# Deliberate omissions:
#   * KDE Plasma / plasmalogin / kwin are not installed.
#   * printing, guest agents, WWAN and non-Qualcomm firmware groups are left out;
#     the tablet has no such hardware in use.
#   * the generic Fedora kernel is NOT installed here.  kernel-liuqin is injected
#     at root.img assembly time with its matching modules.
#
# Docs: mkosi/README.md

[Content]
Packages=
    @core
    @base-graphical
    @workstation-product
    @gnome-desktop
    @firefox
    @multimedia
    @networkmanager-submodules
    @desktop-accessibility
    @libreoffice
    default-fonts-core-sans
    google-noto-color-emoji-fonts
    google-noto-sans-cjk-vf-fonts
    google-noto-sans-mono-vf-fonts
    google-noto-sans-vf-fonts
    google-noto-serif-vf-fonts
    gnome-shell-extension-light-style
    gnome-tweaks
    ibus
    ibus-libpinyin
    fprintd
    fprintd-pam
    iio-sensor-proxy
    gnome-keyring
    gnome-keyring-pam
    libcamera
    libcamera-ipa
    libcamera-gstreamer
    libcamera-tools
    v4l-utils
    ffmpeg-free
    dtc
    patch
    gdisk
    flatpak
    podman
    toolbox
