# liuqin Fedora 44 — KDE Plasma Desktop profile (not Plasma Mobile).
#
# Curated subset of the Fedora KDE spin (`kde-desktop` comps group; in Fedora 44
# the group's mandatory packages are plasma-desktop / plasma-workspace /
# plasma-login-manager / plasma-setup / plasma-workspace-wallpapers, i.e. the
# group already targets Plasma Login Manager, not SDDM). A curated explicit list
# is used instead of `Packages=@kde-desktop` so the image content is pinned and
# reproducible (comps groups drift between Fedora releases) and so the device
# layer can override individual components later.
#
# Selection rules:
#   - Fedora KDE spin baseline, minus PIM/app-store/PIM-indexer bulk that a
#     bring-up image does not need yet (akonadi, baloo indexer).
#   - One office suite is required by the delivery baseline (TN0031 / ADR-0004
#     D6: the QEMU desktop workflow must prove an office application):
#     LibreOffice Writer + Calc with the Qt6/KDE (kf6) integration package.
#   - Everything the task list calls out as tablet-critical is explicit here.
#   - Both OSKs are installed: `plasma-keyboard` (Plasma 6.7+, preferred) and
#     `maliit-keyboard` (fallback); the session decides, see docs/build/rootfs-build.md.
#   - `plasma-login-manager` (plasmalogin, pipa's choice and Fedora 44 KDE's
#     comps default) is the login manager; `sddm` is intentionally NOT installed
#     (decision record: docs/build/rootfs-build.md).
#   - Fingerprint: fprintd + libfprint + fprintd-pam (PAM module for plasmalogin
#     and kscreenlocker) are installed; hardware support is pending-device.
#
# Docs: docs/build/rootfs-build.md
