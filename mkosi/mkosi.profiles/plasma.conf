# liuqin Fedora KDE Plasma Desktop profile (retained historical reference).
#
# This profile targets the Fedora 44-era KDE spin and is kept for comparison and
# fallback. It is not the default release image; Fedora 45 / GNOME 51 is.
#
# Curated subset of the Fedora KDE spin (`kde-desktop` comps group). A curated
# explicit list is used instead of `Packages=@kde-desktop` so the image content
# is pinned and reproducible (comps groups drift between Fedora releases) and so
# the device layer can override individual components later.
#
# Selection rules:
#   - Fedora KDE spin baseline, minus PIM/app-store/PIM-indexer bulk that a
#     bring-up image does not need yet (akonadi, baloo indexer).
#   - One office suite is included: LibreOffice Writer + Calc with the Qt6/KDE
#     (kf6) integration package.
#   - Tablet-critical packages are explicit here.
#   - Both OSKs are installed: `plasma-keyboard` (Plasma 6.7+, preferred) and
#     `maliit-keyboard` (fallback); the session decides.
#   - `plasma-login-manager` (plasmalogin) is the login manager; `sddm` is
#     intentionally NOT installed.
#   - Fingerprint: fprintd + libfprint + fprintd-pam (PAM module for plasmalogin
#     and kscreenlocker) are installed; hardware support is pending-device.
[Content]
Packages=
    PackageKit
    PackageKit-command-not-found
    accountsservice
    ark
    aurorae
    bluedevil
    breeze-gtk
    breeze-icon-theme
    default-fonts-core-sans
