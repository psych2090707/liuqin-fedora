# Fill the rear channels when a stream has fewer channels than the output.
#
# The four-channel speaker profile exposes FL/FR/RL/RR.  Without this, a
# stereo stream (browser, media player) only drives the front pair and the
# rear speakers stay silent.  "simple" copies the front channels to the rear;
# it only applies when up-mixing is actually needed, so a native 4.0 stream is
# passed through unchanged.
stream.properties = {
    channelmix.upmix = true
    channelmix.upmix-method = simple
}
