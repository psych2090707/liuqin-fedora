[Unit]
# This device has the 2023 boot chain. Keep the opt-out marker intact.
# Permit the controlled old-firmware installation only when its manifest exists.
ConditionPathExists=
ConditionPathExists=/etc/liuqin/slpi-old-firmware.SHA256SUMS

[Service]
ExecStartPre=/usr/bin/sha256sum --check --status /etc/liuqin/slpi-old-firmware.SHA256SUMS
