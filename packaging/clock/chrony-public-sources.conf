# Additional public sources checked from liuqin on 2026-11-13.
# Slow/lossy links: allow up to 10s RTT, bounded uncertainty and two agreeing
# selectable sources. Retain frequency tracking (at least four samples).
# No burst here: a new request can supersede a reply still delayed in transit.
# Normal 64-256s polling leaves time for slow responses. Fedora's original pool
# remains the fast-start fallback; these sources cover the slow path.
# Public endpoints: https://help.aliyun.com/en/ecs/user-guide/alibaba-cloud-ntp-server/
# https://www.tencentcloud.com/document/product/213/39161
# https://www.cloudflare.com/time/
minsources 2
minsamples 4
maxdistance 6
maxjitter 2
server ntp.aliyun.com minpoll 6 maxpoll 8 maxdelay 10
server time.cloud.tencent.com minpoll 6 maxpoll 8 maxdelay 10
server time.cloudflare.com minpoll 6 maxpoll 8 maxdelay 10
