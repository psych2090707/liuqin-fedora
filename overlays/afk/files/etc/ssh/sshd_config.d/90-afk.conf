# AFK channel — sshd drop-in for the USB NCM link.
#
# Included from /etc/ssh/sshd_config line 15 ("Include /etc/ssh/sshd_config.d/*.conf"),
# so these values override the shipped defaults below that line.
#
# Bootstrap order used by tools/afk/afk.sh:
#   1. password auth (dev user `user` / dev password)  <- first contact only
#   2. tools/afk/afk.sh overlay-install pushes the AFK public key
#   3. after that the host uses the key exclusively (PasswordAuthentication can be
#      turned off by install.sh --no-password-auth or by editing this drop-in).
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no

# Only the dev user may log in over the AFK channel.  Remove this line if a
# different account is provisioned (see tools/afk/README.md).
AllowUsers user

# Detect a dead USB link quickly and reap the session (sshd -> pty -> shell).
ClientAliveInterval 30
ClientAliveCountMax 6
MaxAuthTries 5
MaxSessions 10

# usb0 is a point-to-point link: no need for GSSAPI/DNS lookups on login.
UseDNS no
GSSAPIAuthentication no
