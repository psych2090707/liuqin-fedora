# AFK channel (TN0048) — keep NetworkManager's hands off the USB NCM link.
#
# The initramfs creates the configfs NCM gadget and sets 192.168.7.2/24 on usb0
# before switch_root.  That address lives in the kernel, but NetworkManager's
# default profile would take the interface over, flush the address and wait for
# a DHCP lease — and the initramfs' udhcpd died with switch_root.  Result: the
# tablet becomes unreachable over USB exactly when the AFK channel is needed.
#
# So the overlay owns usb0:
#   * NM treats it as unmanaged (this file), and
#   * afk-usb0-address.service (+ .timer safety net) pins 192.168.7.2/24 and
#     brings the link up.
# Device-side DHCP for the host is then served by afk-usb0-dhcp.service.
[keyfile]
unmanaged-devices=interface-name:usb0
