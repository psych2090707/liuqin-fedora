# AFK channel (TN0048) — plasmalogin (Plasma Login Manager) autologin.
#
# Why: KRDP and the screenshot helper only exist inside a running Plasma
# session.  Without autologin the tablet sits at the greeter after every reboot
# and the AFK channel can only reach the greeter, not the desktop.
#
# plasmalogin is the Fedora 44 KDE login manager (not sddm); it reads
# /etc/plasmalogin.conf and /etc/plasmalogin.conf.d/*.conf.
# Session must be the *file name* from /usr/share/wayland-sessions/, i.e.
# "plasma.desktop" (sddm-style "plasma" makes plasmalogin log
# "Unable to find autologin session entry" and skip autologin).
#
# SECURITY: this is a development-only device image (dev user `user`, password
# `147147`, wheel).  Autologin means anyone holding the tablet has a live,
# unlocked desktop session.  Do not ship this drop-in in a release image.
[Autologin]
User=user
Session=plasma.desktop
# Log back in when the session exits (otherwise a crash drops us to the greeter
# and the AFK channel loses the desktop until someone taps the screen).
Relogin=true
