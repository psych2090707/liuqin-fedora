# AFK channel (TN0048) — DHCP server for the USB NCM link, device side.
#
# Purpose: keep the RAM-installer behaviour the host tools already rely on: the
# tablet serves 192.168.7.10-19 to whatever is on the other end of the cable, so
# the host's NetworkManager gets 192.168.7.10 automatically and no host root
# privileges are needed to reach the device at 192.168.7.2.
#
# DHCP only: port=0 disables the DNS server, and options 3 (router) and 6 (DNS)
# are deliberately empty so the host never routes anything through the tablet.
port=0
interface=usb0
bind-dynamic
except-interface=lo
dhcp-range=192.168.7.10,192.168.7.19,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
dhcp-authoritative
no-resolv
no-hosts
domain-needed
bogus-priv
cache-size=0
pid-file=/run/afk-dnsmasq.pid
dhcp-leasefile=/var/lib/afk/dhcp-leases
log-facility=-
