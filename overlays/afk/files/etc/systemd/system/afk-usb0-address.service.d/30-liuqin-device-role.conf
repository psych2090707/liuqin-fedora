[Unit]
# The device controller can unregister the netdev. Reconciliation must precede
# the old netdev existence check, otherwise the repair is skipped when needed.
ConditionPathExists=
ConditionPathExists=/etc/liuqin-slpi-disabled

[Service]
ExecStartPre=/usr/bin/python3 -B /usr/libexec/liuqin/usb-device-role.py
