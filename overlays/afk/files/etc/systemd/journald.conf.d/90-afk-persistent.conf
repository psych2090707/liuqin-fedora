# AFK channel — persistent journal across reboots.
#
# Without this the device only logs to /run (RAM): after the reboots that the
# AFK channel itself triggers there would be no previous-boot evidence.
# systemd-pstore.service (enabled by the Fedora preset) separately archives
# /sys/fs/pstore, so a kernel panic survives too.
[Journal]
Storage=persistent
# 512 MiB cap on /var/log/journal; the AFK host pulls bundles regularly and the
# rootfs' /var is not huge.
SystemMaxUse=512M
SystemMaxFileSize=64M
# Keep RAM logging unchanged for tools that read /run/log/journal.
RuntimeMaxUse=64M
# Do not spam the physical console (the tablet has no serial console attached).
ForwardToWall=yes
