# AFK channel — systemd user drop-in for KRDP.
# Installed to /home/user/.config/systemd/user/app-org.kde.krdpserver.service.d/
#
# KRDP talks to KWin through the KDE RemoteDesktop portal and needs a stored
# "kde-authorized remote-desktop" permission to open its screencast session
# without a human clicking the sharing dialog.  afk-krdp-preauth sets it at
# every login; ordering it before krdpserver makes the RDP server unattended.
[Unit]
Wants=afk-krdp-preauth.service
After=afk-krdp-preauth.service
