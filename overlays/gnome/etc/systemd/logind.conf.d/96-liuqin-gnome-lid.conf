# TN0077: keyboard-cover lid switch policy when a GNOME session is used.
#
# logind's HandleLidSwitch=suspend would double-handle the lid.  The custom
# service /usr/local/libexec/liuqin-lid-policy owns the action: lid close
# suspends (after locking the user session and waiting for GetActive), and
# LID_RESUSPEND=1 handles an early wake with the lid still closed.  Keep
# logind at "ignore" so the same close does not submit a second suspend.
#
# The lid service is enabled by
# /etc/systemd/system-preset/90-liuqin-power.preset; a bare systemctl enable
# is undone by Fedora's first-boot preset-all.
#
# KDE is unaffected: PowerDevil consumes the lid event through udev and
# applies powerdevilrc LidAction=64 (turn screen off), which is what the user
# already validated; logind's own suspend action is the fallback this file
# disables. For GNOME, the custom lid service above owns the action.
#
# Revert: delete this file and run `systemctl restart systemd-logind` (or
# reboot). Default HandleLidSwitch=suspend returns for every session.

[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
