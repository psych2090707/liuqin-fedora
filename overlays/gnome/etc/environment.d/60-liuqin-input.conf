# GNOME system input defaults. No dependency on fcitx5's shell setup or on a
# locally edited gnome.desktop. Plasma recovery's profile branch overrides
# these for its own session; no input daemon is started here.
#
# Do not force GTK_IM_MODULE=ibus on GNOME Wayland: that makes GTK apps use
# GTK's own IBus module, bypassing the compositor text-input path.  The Shell
# then cannot see their client preedit, and the OSK/IBus bubble cannot show
# the pinyin caption or correct the preedit cursor.  GTK3/4 use Wayland
# text-input-v3 with IBus through the Shell; XWayland apps still use XIM.
INPUT_METHOD=ibus
QT_IM_MODULE=ibus
QT_IM_MODULES=wayland;ibus
XMODIFIERS=@im=ibus
SDL_IM_MODULE=ibus
GLFW_IM_MODULE=ibus
