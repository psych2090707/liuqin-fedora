# Product USB NCM link: NetworkManager must not take over usb0.
#
# The initramfs creates the gadget and sets 192.168.7.2/24 before switch_root.
# If NM manages the interface it flushes the address and waits for a DHCP lease
# that the initramfs server can no longer provide.  This layer owns usb0:
# liuqin-usb0-link pins the address, liuqin-usb0-dhcp serves the host.
[keyfile]
unmanaged-devices=interface-name:usb0
