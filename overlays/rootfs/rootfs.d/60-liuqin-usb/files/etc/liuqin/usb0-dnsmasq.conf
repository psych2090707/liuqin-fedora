# Product USB NCM link: DHCP only for the host on the other end of the cable.
#
# The tablet is 192.168.7.2/24.  This server hands the host 192.168.7.10-19
# and deliberately sends no router or DNS option, so the host never routes
# through the tablet.  port=0 disables DNS.
port=0
interface=usb0
bind-dynamic
except-interface=lo
dhcp-range=192.168.7.10,192.168.7.19,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
dhcp-authoritative
no-resolv
no-hosts
domain-needed
bogus-priv
cache-size=0
pid-file=/run/liuqin-usb0-dnsmasq.pid
dhcp-leasefile=/var/lib/liuqin-usb0/dhcp-leases
log-facility=-
