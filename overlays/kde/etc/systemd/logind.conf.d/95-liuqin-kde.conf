# liuqin KDE power-key decision (overrides the device package's
# /usr/lib/systemd/logind.conf.d/90-liuqin.conf; same values, kept here so the
# image's KDE behavior does not depend on device-RPM content).
#
# The upstream device package delegates the power key to liuqin-power-keyd
# because GNOME/Mutter needs it. On KDE, PowerDevil takes logind's
# handle-power-key inhibitor and performs the configured action itself
# (PowerButtonAction in /etc/xdg/powerdevilrc). We keep HandlePowerKey=ignore:
#   * PowerDevil session active -> logind defers, PowerDevil acts (correct);
#   * greeter/no PowerDevil      -> the key does nothing instead of a
#     surprise poweroff; the PMIC 10-20s long-press force-off still works.
# Do NOT enable liuqin-power-keyd on top of PowerDevil (evdev double-handling).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
