[Service]
# IMPORTANT — FIRST-BOOT PRESET TRAP
# Fedora's first boot runs `systemctl preset-all`.  99-default-disable.preset
# contains "disable *", so this service is only kept enabled because
# /etc/systemd/system-preset/90-liuqin-power.preset lists it.  A bare
# `systemctl enable` in an image is undone on first boot.  Keep that preset in
# sync when adding/renaming liuqin power services.
#
# TN0086: route the pinned evdev daemon through the configurable policy helper.
# Higher-numbered drop-in wins over 30-gnome-action.conf.
ExecStart=
ExecStart=/usr/libexec/liuqin/liuqin-power-keyd --action-helper /usr/local/libexec/liuqin-power-key-policy
