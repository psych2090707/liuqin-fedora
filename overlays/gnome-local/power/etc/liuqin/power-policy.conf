# liuqin power-key / lid policy (tablet behaviour).
#
# IMPORTANT — FIRST-BOOT PRESET TRAP
# Fedora's first boot runs `systemctl preset-all`.  99-default-disable.preset
# contains "disable *", so a unit that is only enabled with `systemctl enable`
# in the image is turned OFF again on the first boot.  The lid/power-key units
# MUST be listed in /etc/systemd/system-preset/90-liuqin-power.preset.  If you
# add another service that reads this file, add it to that preset too.
# See overlays/gnome-local/README.md ("首启 preset 陷阱").
#
# This file is the single source of truth for the custom policy. It is written
# by the "电源键与合盖" settings app (/usr/local/bin/liuqin-power-settings) and
# read by:
#   * /usr/local/libexec/liuqin-power-key-policy (power-key helper wrapper)
#   * /usr/local/libexec/liuqin-lid-policy      (UPower lid watcher)
#
# SHORT_ACTION: blank | suspend | nothing
#   Executed only when the physical screen is already lit.  When the screen is
#   dark (blanked, asleep, or a failed panel resume), the first short press
#   wakes/recovers the display instead and does not run this action.
# LONG_ACTION:  nothing | poweroff | reboot | suspend
# LID_ACTION:   blank | suspend | nothing
# LID_RESUSPEND: 0 | 1
#   1 = after an automatic resume with the lid still closed, on battery, no
#   user input and no sleep inhibitor, request one more suspend after 20 s.
#   Applies to LID_ACTION=blank and LID_ACTION=suspend; LID_ACTION=nothing
#   never auto-resuspends. An abnormal short wake with the lid open gets one
#   retry after 10 s; a long sleep returns to GNOME's normal idle policy.
#   The closed-lid display protection works independently of this switch.
#
# "blank" means: put the panel into Mutter PowerSaveMode 3 (display off).
# "suspend" means: ask logind to suspend immediately (the polkit rule allows
# this only for the single desktop user).
#
# 2026-11-06 verified: immediate suspend works when the lid service locks the
# user session first (org.gnome.ScreenSaver.Lock, then wait for GetActive, then
# logind.Suspend). Without that lock step, opening the lid during resume let the
# GDM greeter take the active session; the old GNOME shell lost input control
# and the framebuffer console stayed visible ("half screen of dmesg").
# Do not remove the lock-before-suspend step from liuqin-lid-policy.
#
# Current choice: a short power press on a lit screen and a lid close both
# suspend immediately, like a laptop.  With the screen dark, the first short
# press only wakes it.  The Hall sensor wakes the tablet on lid open;
# LID_RESUSPEND=1 puts it back to sleep if an early wake happens while the lid
# is still closed.  With the lid closed the covered panel is kept dark; it is
# lit again when the lid opens.

SHORT_ACTION=suspend
LONG_ACTION=nothing
LID_ACTION=suspend
LID_RESUSPEND=1
